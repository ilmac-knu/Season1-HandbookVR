<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>일맥회 전자수첩 VR 체험</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>

<script
src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
</script>

<style>

html,body{

margin:0;
width:100%;
height:100%;

}

#panorama{

width:100%;
height:100vh;

}

</style>

</head>

<body>

<div id="panorama"></div>

<script>

pannellum.viewer('panorama',{

"type":"equirectangular",

"panorama":"images/handbook-vr-main.png",

"autoLoad":true,

"title":"일맥회 전자수첩 VR 체험",

"author":"AI 활용 사례",

"hfov":140,

"pitch":-20,

"yaw":0,

"showControls":true,

"showFullscreenCtrl":true,

"showZoomCtrl":true,

"hotSpots":[

{

"pitch":-12,
"yaw":-35,

"type":"info",

"text":"전자수첩 소개"

},

{

"pitch":-10,
"yaw":0,

"type":"info",

"text":"AI 협업"

},

{

"pitch":-10,
"yaw":55,

"type":"info",

"text":"회원 명부"

},

{

"pitch":-5,
"yaw":120,

"type":"info",

"text":"추억의 사진첩"

},

{

"pitch":-10,
"yaw":-110,

"type":"info",

"text":"일맥회 소개"

}

]

});

</script>

</body>

</html>
